<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- CasualWax Halo (draft), one seamless tile: haloes on a staggered grid -->
  <rect width="60" height="60" fill="#e0451f"/>
  <g id="h">
    <circle r="20" fill="#f3efe6"/>
    <circle r="14" fill="#1e44b8"/>
    <circle r="7" fill="#f5b315"/>
  </g>
  <use href="#h" x="30" y="30"/>
  <use href="#h" x="0" y="0"/><use href="#h" x="60" y="0"/>
  <use href="#h" x="0" y="60"/><use href="#h" x="60" y="60"/>
</svg>
